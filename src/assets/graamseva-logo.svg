<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100" fill="none" width="100%" height="100%">
  <defs>
    <!-- Saffron Gradient for Pin Left -->
    <linearGradient id="saffronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9933" />
      <stop offset="60%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <!-- Green Gradient for Hand/Tree -->
    <linearGradient id="greenGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#84CC16" />
    </linearGradient>

    <!-- Leaf Yellow-Green Accent -->
    <linearGradient id="leafAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#84CC16" />
    </linearGradient>
  </defs>

  <!-- Ground Shadows -->
  <g opacity="0.35">
    <ellipse cx="32" cy="88" rx="18" ry="4" fill="#FDBA74" />
    <ellipse cx="48" cy="90" rx="16" ry="4" fill="#99F6E4" />
    <ellipse cx="60" cy="87" rx="14" ry="3.5" fill="#BBF7D0" />
  </g>

  <!-- Pin Outer Saffron / Orange Arc (Left Side) -->
  <path d="M 44 10 
           C 22 10, 10 26, 10 46 
           C 10 65, 26 78, 44 92 
           C 40 80, 32 68, 30 52 
           C 28 36, 36 20, 52 14 
           Z" 
        fill="url(#saffronGrad)" />

  <!-- Green Hand & Leaves (Right Side & Top Branch) -->
  <path d="M 44 92 
           C 54 82, 60 68, 56 50 
           C 52 35, 58 24, 72 16 
           C 60 22, 52 32, 50 44 
           C 48 58, 40 74, 44 92 Z" 
        fill="url(#greenGrad)" />

  <!-- Stylized Leaf Clusters / Fingers -->
  <!-- Finger 1 / Top Leaf -->
  <path d="M 62 26 C 62 14, 72 8, 76 6 C 78 14, 72 22, 62 26 Z" fill="url(#leafAccent)" />
  <!-- Finger 2 / Upper Leaf -->
  <path d="M 68 32 C 72 22, 84 18, 90 18 C 88 26, 80 32, 68 32 Z" fill="#84CC16" />
  <!-- Finger 3 / Mid Leaf -->
  <path d="M 70 38 C 78 30, 92 30, 96 32 C 92 40, 80 42, 70 38 Z" fill="#10B981" />
  <!-- Finger 4 / Lower Leaf -->
  <path d="M 68 46 C 76 42, 88 44, 92 48 C 86 54, 76 52, 68 46 Z" fill="#059669" />
  <!-- Small Accent Leaf -->
  <path d="M 58 18 C 58 10, 66 6, 68 5 C 70 11, 64 17, 58 18 Z" fill="#EAB308" />

  <!-- Center Circle for Ashoka Chakra -->
  <circle cx="44" cy="42" r="17" fill="#FFFFFF" stroke="url(#saffronGrad)" stroke-width="1.5" />

  <!-- Ashoka Chakra (24 Spokes) -->
  <g transform="translate(44, 42)">
    <!-- Outer Rim -->
    <circle cx="0" cy="0" r="14.5" stroke="#002147" stroke-width="1.8" fill="none" />
    <!-- Inner Hub -->
    <circle cx="0" cy="0" r="2.8" fill="#002147" />
    
    <!-- 24 Spokes -->
    <line x1="0" y1="0" x2="0" y2="-14.5" stroke="#002147" stroke-width="1" />
    <line x1="0" y1="0" x2="0" y2="14.5" stroke="#002147" stroke-width="1" />
    <line x1="0" y1="0" x2="-14.5" y2="0" stroke="#002147" stroke-width="1" />
    <line x1="0" y1="0" x2="14.5" y2="0" stroke="#002147" stroke-width="1" />
    
    <line x1="0" y1="0" x2="10.25" y2="-10.25" stroke="#002147" stroke-width="0.9" />
    <line x1="0" y1="0" x2="-10.25" y2="10.25" stroke="#002147" stroke-width="0.9" />
    <line x1="0" y1="0" x2="-10.25" y2="-10.25" stroke="#002147" stroke-width="0.9" />
    <line x1="0" y1="0" x2="10.25" y2="10.25" stroke="#002147" stroke-width="0.9" />

    <line x1="0" y1="0" x2="5.55" y2="-13.4" stroke="#002147" stroke-width="0.8" />
    <line x1="0" y1="0" x2="-5.55" y2="13.4" stroke="#002147" stroke-width="0.8" />
    <line x1="0" y1="0" x2="13.4" y2="-5.55" stroke="#002147" stroke-width="0.8" />
    <line x1="0" y1="0" x2="-13.4" y2="5.55" stroke="#002147" stroke-width="0.8" />

    <line x1="0" y1="0" x2="-5.55" y2="-13.4" stroke="#002147" stroke-width="0.8" />
    <line x1="0" y1="0" x2="5.55" y2="13.4" stroke="#002147" stroke-width="0.8" />
    <line x1="0" y1="0" x2="-13.4" y2="-5.55" stroke="#002147" stroke-width="0.8" />
    <line x1="0" y1="0" x2="13.4" y2="5.55" stroke="#002147" stroke-width="0.8" />

    <line x1="0" y1="0" x2="3.75" y2="-14.0" stroke="#002147" stroke-width="0.7" />
    <line x1="0" y1="0" x2="-3.75" y2="14.0" stroke="#002147" stroke-width="0.7" />
    <line x1="0" y1="0" x2="14.0" y2="-3.75" stroke="#002147" stroke-width="0.7" />
    <line x1="0" y1="0" x2="-14.0" y2="3.75" stroke="#002147" stroke-width="0.7" />

    <line x1="0" y1="0" x2="-3.75" y2="-14.0" stroke="#002147" stroke-width="0.7" />
    <line x1="0" y1="0" x2="3.75" y2="14.0" stroke="#002147" stroke-width="0.7" />
    <line x1="0" y1="0" x2="-14.0" y2="-3.75" stroke="#002147" stroke-width="0.7" />
    <line x1="0" y1="0" x2="14.0" y2="3.75" stroke="#002147" stroke-width="0.7" />
  </g>

  <!-- Typography / Text (Devanagari & English) -->
  <text x="112" y="44" fill="#045F46" font-family="'Noto Sans Devanagari', 'Devanagari Sangam MN', 'Arial Unicode MS', sans-serif" font-weight="900" font-size="34" letter-spacing="0.5">ग्रामसेवा</text>
  <text x="114" y="78" font-family="'Plus Jakarta Sans', 'Inter', ui-sans-serif, system-ui, sans-serif" font-weight="800" font-size="31" letter-spacing="-0.5">
    <tspan fill="#045F46">Graam</tspan><tspan fill="#10B981">Seva</tspan>
  </text>
</svg>
